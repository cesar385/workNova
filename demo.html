<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        .sidebar-link {
            transition: all 0.2s ease-in-out;
        }
        .sidebar-link:hover, .sidebar-link.active {
            background-color: #1e40af;
            color: white;
            transform: translateX(4px);
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Estilos para el scrollbar del Kanban */
        .kanban-scroll::-webkit-scrollbar {
            height: 8px;
        }
        .kanban-scroll::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 10px;
        }
        .kanban-scroll::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 10px;
        }
        .kanban-scroll::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
        /* Estilos para Pestañas Activas */
        .job-tab.active {
            border-color: #2563eb;
            color: #2563eb;
        }
        /* 9-Box Grid Styles */
        .nine-box-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 4px;
            aspect-ratio: 1 / 1;
        }
        .nine-box-cell {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.5rem;
            padding: 4px;
            cursor: pointer;
        }
        .employee-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }
        #nine-box-tooltip {
            pointer-events: none;
        }
    </style>
</head>

                    <td class="p-3 font-medium">${c.name}</td>
                    <td class="p-3 text-center font-bold text-blue-600">${c.score}</td>
                    <td class="p-3 text-gray-600">${c.obs}</td>
                </tr>
            `).join('');

            const nineBoxGridHTML = this.createNineBoxGrid(emp.nineBox.performance, emp.nineBox.potential);

            container.innerHTML = `
                <div class="fade-in">
                    <button id="back-to-perf-list" class="flex items-center text-sm text-gray-600 hover:text-black mb-4">
                        <i data-lucide="arrow-left" class="w-4 h-4 mr-2"></i> Volver a la lista
                    </button>
                    <div class="bg-white rounded-xl shadow-md p-6">
                        <div class="flex items-start justify-between mb-6 border-b pb-4">
                            <div class="flex items-center space-x-4">
                                <img src="${emp.avatar}" alt="${emp.name}" class="rounded-full">
                                <div>
                                    <h2 class="text-2xl font-bold text-gray-800">Evaluación de Desempeño: ${emp.name}</h2>
                                    <p class="text-gray-500">${emp.position} • Antigüedad: ${emp.seniority} • Fecha: ${emp.date}</p>
                                </div>
                            </div>
                            <span class="bg-${emp.statusColor}-100 text-${emp.statusColor}-800 font-semibold px-4 py-2 rounded-full">${emp.status}</span>
                        </div>

                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                            <!-- Columna Izquierda: Matriz y Gráfico -->
                            <div class="space-y-6">
                                <div>
                                    <h3 class="text-lg font-semibold mb-2 text-gray-700">Matriz de Talento (9-Box)</h3>
                                    ${nineBoxGridHTML}
                                </div>
                                <div>
                                    <h3 class="text-lg font-semibold mb-2 text-gray-700">Gráfico de Competencias</h3>
                                    <div class="h-72">
                                        <canvas id="competencyChart"></canvas>
                                    </div>
                                </div>
                            </div>
                            <!-- Columna Derecha: Tabla y Recomendaciones -->
                            <div class="space-y-6">
                                <h3 class="text-lg font-semibold text-gray-700">Evaluación por Competencias</h3>
                                <div class="overflow-auto max-h-96">
                                    <table class="w-full text-sm">
                                        <thead class="bg-gray-100 sticky top-0">
                                            <tr>
                                                <th class="p-3 text-left font-semibold text-gray-600">Competencia</th>
                                                <th class="p-3 text-center font-semibold text-gray-600">Nota</th>
                                                <th class="p-3 text-left font-semibold text-gray-600">Observaciones</th>
                                            </tr>
                                        </thead>
                                        <tbody>${competenciesHTML}</tbody>
                                    </table>
                                </div>
                                <div class="bg-gray-50 p-4 rounded-lg">
                                    <p class="font-bold">Síntesis:</p>
                                    <ul class="list-disc list-inside text-sm text-gray-700 mt-2">
                                        <li><span class="font-semibold">Fortalezas:</span> ${emp.summary.strengths}</li>
                                        <li><span class="font-semibold">Aspectos a mejorar:</span> ${emp.summary.improvements}</li>
                                    </ul>
                                    <p class="font-bold mt-4">Recomendación:</p>
                                    <p class="text-sm text-gray-700 mt-2">${emp.recommendation}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
            document.getElementById('back-to-perf-list').addEventListener('click', () => this.renderPerformanceList());
            
            // --- NEW TOOLTIP LOGIC ---
            const tooltip = document.getElementById('nine-box-tooltip');
            const tooltipTitle = document.getElementById('tooltip-title');
            const tooltipContent = document.getElementById('tooltip-content');
            
            document.querySelectorAll('.nine-box-cell').forEach(cell => {
                cell.addEventListener('mouseenter', (e) => {
                    const target = e.currentTarget;
                    tooltipTitle.textContent = target.dataset.tooltipTitle;
                    tooltipContent.textContent = target.dataset.tooltipContent;
                    
                    tooltip.classList.remove('invisible', 'opacity-0');

                    const rect = target.getBoundingClientRect();
                    tooltip.style.left = `${rect.left + window.scrollX + rect.width / 2 - tooltip.offsetWidth / 2}px`;
                    tooltip.style.top = `${rect.top + window.scrollY - tooltip.offsetHeight - 10}px`;
                });

                cell.addEventListener('mouseleave', () => {
                    tooltip.classList.add('invisible', 'opacity-0');
                });
            });

            this.initCharts('desempenoDetail', emp);
        },
        createNineBoxGrid: function(performance, potential) {
             const labels = [
                ['Enigma', 'Futura Estrella', 'Estrella'],
                ['Dilema', 'Jugador Clave', 'Alto Potencial'],
                ['Bajo Desempeño', 'Profesional Sólido', 'Alto Desempeño']
            ];
            const colors = [
                ['bg-purple-200', 'bg-blue-300', 'bg-green-400'],
                ['bg-orange-200', 'bg-blue-200', 'bg-green-300'],
                ['bg-red-300', 'bg-orange-300', 'bg-green-200']
            ];
            const explanations = [
                { title: 'Enigma', content: 'Alto potencial pero bajo desempeño. Investigar causas: ¿rol incorrecto, falta de motivación o herramientas?' },
                { title: 'Futura Estrella', content: 'Alto potencial con desempeño en desarrollo. Necesitan coaching y nuevos desafíos para crecer.' },
                { title: 'Estrella', content: 'Alto potencial y alto desempeño. Son los líderes del futuro. Hay que retenerlos y desarrollarlos.' },
                { title: 'Dilema', content: 'Potencial medio con bajo desempeño. Requieren un plan de mejora de rendimiento claro.' },
                { title: 'Jugador Clave', content: 'Potencial y desempeño medios. Son el corazón del equipo. Necesitan desarrollo de habilidades.' },
                { title: 'Alto Potencial', content: 'Potencial medio con alto desempeño. Contribuyentes valiosos. Mantenerlos motivados.' },
                { title: 'Bajo Desempeño', content: 'Bajo potencial y bajo desempeño. Requieren un plan de mejora estricto o considerar la desvinculación.' },
                { title: 'Profesional Sólido', content: 'Bajo potencial con desempeño medio. Cumplen bien con su rol. Mantenerlos comprometidos.' },
                { title: 'Alto Desempeño', content: 'Bajo potencial con alto desempeño. Expertos en su rol actual. Valorar su experiencia.' }
            ];

            // performance is column (1-3), potential is row (1-3)
            // But CSS grid is row-major, so potential determines row, performance determines column
            const p_col = performance - 1; // 0-indexed
            const p_row = 3 - potential; // 0-indexed, inverted
            
            let cells = '';
            for(let row = 0; row < 3; row++) {
                for(let col = 0; col < 3; col++) {
                    const isEmployeeCell = (row === p_row && col === p_col);
                    const explanationIndex = row * 3 + col;
                    const explanation = explanations[explanationIndex];

                    cells += `
                        <div class="nine-box-cell ${colors[row][col]} text-center" 
                             data-tooltip-title="${explanation.title}" 
                             data-tooltip-content="${explanation.content}">
                            <span class="text-xs font-semibold text-gray-700">${labels[row][col]}</span>
                            ${isEmployeeCell ? '<div class="employee-dot bg-blue-600 absolute"></div>' : ''}
                        </div>`;
                }
            }

            return `
                <div class="relative">
                    <div class="nine-box-grid">${cells}</div>
                    <div class="absolute -bottom-6 left-0 right-0 text-center text-sm font-semibold text-gray-600">Desempeño →</div>
                    <div class="absolute -left-12 top-0 bottom-0 text-center text-sm font-semibold text-gray-600" style="writing-mode: vertical-rl; transform: rotate(180deg);">Potencial →</div>
                </div>
            `;
        },

        // Función para actualizar el link activo en la sidebar
        updateActiveLink: function(viewName) {
            this.links.forEach(link => {
                if (link.dataset.view === viewName) {
                    link.classList.add('active');
                } else {
                    link.classList.remove('active');
                }
            });
        },
        // Inicializador de listeners para el módulo de reclutamiento
        setupRecruitmentListeners: function() {
            const tabs = document.querySelectorAll('.job-tab');
            const tabContents = document.querySelectorAll('.job-tab-content');

            tabs.forEach(tab => {
                tab.addEventListener('click', (e) => {
                    e.preventDefault();
                    
                    tabs.forEach(item => item.classList.remove('active'));
                    tab.classList.add('active');

                    const tabId = tab.dataset.tab;
                    tabContents.forEach(content => {
                        if (content.id === `${tabId}Content`) {
                            content.classList.remove('hidden');
                        } else {
                            content.classList.add('hidden');
                        }
                    });
                });
            });

            // Activar la primera pestaña por defecto
            if (tabs.length > 0) {
                tabs[0].click();
            }
            
            const candidateCards = document.querySelectorAll('[data-candidate]');
            candidateCards.forEach(card => {
                card.addEventListener('click', () => {
                    const candidateId = card.dataset.candidate;
                    this.showCandidateModal(candidateId);
                });
            });
        },
        // Función para mostrar el modal del candidato
        showCandidateModal: function(candidateId) {
            const data = this.candidateData[candidateId];
            if (!data) return;

            this.modal.querySelector('#modal-header').innerHTML = data.header;
            this.modal.querySelector('#modal-body').innerHTML = data.body;
            
            this.modal.classList.remove('hidden');
            setTimeout(() => {
                this.modal.classList.add('opacity-100');
                this.modal.querySelector('.transform').classList.remove('scale-95');
            }, 10);

            lucide.createIcons();

            const closeModalBtn = this.modal.querySelector('#close-modal-btn');
            closeModalBtn.onclick = () => this.hideCandidateModal();
            this.modal.onclick = (e) => {
                if(e.target === this.modal) this.hideCandidateModal();
            }
        },
        // Función para ocultar el modal
        hideCandidateModal: function() {
            this.modal.classList.remove('opacity-100');
            this.modal.querySelector('.transform').classList.add('scale-95');
            setTimeout(() => {
                this.modal.classList.add('hidden');
            }, 300);
        },
        // Inicializador de gráficos
        initCharts: function(viewName, data) {
            Chart.helpers.each(Chart.instances, (instance) => {
                instance.destroy();
            });

            if (viewName === 'dashboard') {
                const hiringCtx = document.getElementById('hiringChart');
                if (hiringCtx) {
                    new Chart(hiringCtx, {
                        type: 'bar',
                        data: {
                            labels: ['Mar', 'Jun', 'Jul', 'Sep', 'Oct'],
                            datasets: [{
                                label: 'Nuevas Contrataciones',
                                data: [2, 1, 1, 1, 7],
                                backgroundColor: 'rgba(59, 130, 246, 0.7)',
                                borderColor: 'rgba(59, 130, 246, 1)',
                                borderWidth: 1,
                                borderRadius: 5
                            }]
                        },
                        options: { scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }, responsive: true, maintainAspectRatio: false }
                    });
                }
                document.querySelectorAll('.view-risk-performance').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const employeeId = e.currentTarget.dataset.employeeId;
                        this.renderView('desempeno');
                        // We need a slight delay for the view to render before we can click the button
                        setTimeout(() => {
                            const detailButton = document.querySelector(`.view-performance-btn[data-employee-id="${employeeId}"]`);
                            if(detailButton) detailButton.click();
                        }, 100);
                    });
                });
            } else if (viewName === 'desempenoDetail') {
                const competencyCtx = document.getElementById('competencyChart');
                if (competencyCtx) {
                    new Chart(competencyCtx, {
                        type: 'radar',
                        data: {
                            labels: data.competencies.map(c => c.name),
                            datasets: [{
                                label: `Evaluación de ${data.name}`,
                                data: data.competencies.map(c => c.score),
                                fill: true,
                                backgroundColor: 'rgba(59, 130, 246, 0.2)',
                                borderColor: 'rgb(59, 130, 246)',
                                pointBackgroundColor: 'rgb(59, 130, 246)',
                            }]
                        },
                        options: { 
                            scales: { 
                                r: { 
                                    beginAtZero: true, 
                                    max: 5, 
                                    stepSize: 1,
                                    pointLabels: { font: { size: 11 } }
                                } 
                            }, 
                            responsive: true, 
                            maintainAspectRatio: false 
                        }
                    });
                }
            } else if (viewName === 'analytics') {
                const turnoverCtx = document.getElementById('turnoverChart');
                if (turnoverCtx) {
                    new Chart(turnoverCtx, {
                        type: 'line',
                        data: {
                            labels: ['Q1', 'Q2', 'Q3', 'Q4'],
                            datasets: [
                                { label: 'Técnica', data: [8, 12, 15, 18], borderColor: 'rgb(255, 99, 132)', tension: 0.1, pointBackgroundColor: 'rgb(255, 99, 132)'},
                                { label: 'Comercial', data: [5, 6, 8, 7], borderColor: 'rgb(54, 162, 235)', tension: 0.1, pointBackgroundColor: 'rgb(54, 162, 235)'},
                                { label: 'Administración', data: [2, 3, 2, 4], borderColor: 'rgb(75, 192, 192)', tension: 0.1, pointBackgroundColor: 'rgb(75, 192, 192)'}
                            ]
                        },
                        options: { responsive: true, maintainAspectRatio: false }
                    });
                }
                const satisfactionCtx = document.getElementById('satisfactionChart');
                if(satisfactionCtx) {
                    new Chart(satisfactionCtx, {
                        type: 'doughnut',
                        data: {
                            labels: ['Satisfecho', 'Neutral', 'Insatisfecho'],
                            datasets: [{
                                label: 'Satisfacción',
                                data: [65, 25, 10],
                                backgroundColor: ['rgb(75, 192, 192)', 'rgb(255, 205, 86)', 'rgb(255, 99, 132)'],
                                hoverOffset: 4
                            }]
                        },
                        options: { responsive: true }
                    });
                }
                const cohortCtx = document.getElementById('cohortChart');
                 if (cohortCtx) {
                    new Chart(cohortCtx, {
                        type: 'bar',
                        data: {
                            labels: ['Desempeño Previo', 'Desempeño Post-Capacitación'],
                            datasets: [
                                { label: 'Grupo de Control', data: [3.1, 3.2], backgroundColor: 'rgba(255, 99, 132, 0.5)' },
                                { label: 'Cohorte Capacitada', data: [3.0, 4.1], backgroundColor: 'rgba(54, 162, 235, 0.5)' }
                            ]
                        },
                        options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, max: 5 } } }
                    });
                }
            }
        },
        // Setup de eventos
        init: function() {
            this.links.forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const viewName = e.currentTarget.dataset.view;
                    this.renderView(viewName);
                });
            });
            // Cargar vista inicial
            this.renderView('dashboard');
        }
    };

    app.init();
});
</script>
</body>
</html>
